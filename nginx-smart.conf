# OPTIONAL legacy reverse proxy (not used by default install).
# Default install: SolarAssistant on :80, Solar Smart on :8000 — no nginx required.
#
# If you still use this file, SolarAssistant must listen on port 8080 (PORT=8080 in influx-bridge.env).
server {
    listen 80 default_server;
    server_name _;

    # Solar Smart — strip /smart prefix, forward to FastAPI app.
    # Trailing slash on both sides makes nginx strip the /smart/ prefix.
    location /smart/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /smart;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # Redirect bare /smart → /smart/ so relative links work.
    location = /smart {
        return 301 /smart/;
    }

    # SolarAssistant — all other traffic.
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering    off;
    }
}
